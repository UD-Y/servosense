[build-system]
requires = ["setuptools>=66.1"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-contact"
version = "0.1.0"
description = "Feetech STS3215 servo model that reproduces Present_Load / Present_Current telemetry for the SO-101 arm in simulation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Udayan Yadav" }]
# Core (params, registers, servo, telemetry, derive) needs only torch + numpy.
# The Isaac Lab actuator (so101_contact.isaaclab) uses the Isaac Lab of the environment it runs in.
dependencies = ["torch>=2.1", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]
examples = ["matplotlib"]

[tool.setuptools.packages.find]
include = ["so101_contact*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
